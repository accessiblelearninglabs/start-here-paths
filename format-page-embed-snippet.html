<!-- Lets each frame set its own height so there is no inner scrolling. Place once, after the frames. -->
<script>
window.addEventListener('message',function(e){
  var d=e.data; if(!d||!d.startHereEmbed) return;
  document.querySelectorAll('iframe.sh-embed').forEach(function(f){
    if(f.src.indexOf(d.id+'.html')>-1) f.style.height=(d.height+8)+'px';
  });
});
</script>
